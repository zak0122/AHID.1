name: AHID SRMA Topic Discovery

on:
  push:
    branches: ["main", "feature/**"]
  schedule:
    # Daily run: topic discovery samples the previous 180 days of configured journals.
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ahid-topic-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v

      - name: Run PubMed discovery and topic ranking
        working-directory: src
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          MAX_TOPIC_CANDIDATES: "12"
        run: python run_pipeline.py

      - name: Upload generated report
        uses: actions/upload-artifact@v4
        with:
          name: ahid-srma-report-${{ github.run_number }}
          path: output/report_*.md
          if-no-files-found: error
          retention-days: 14

      - name: Commit state and report (main branch only)
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "ahid-topic-discovery[bot]"
          git config user.email "ahid-topic-discovery[bot]@users.noreply.github.com"
          git add -A state output
          git diff --cached --quiet || git commit -m "Daily AHID SRMA topic discovery report"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
